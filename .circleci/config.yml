version: 2.1
orbs:
  docker: circleci/docker@2.8.0

jobs:

  test-docker-build:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - run:
          name: Checkout (HTTPS, public repo)
          command: |
            git clone "https://github.com/suculent/nodemcu-docker-build.git" .
            git checkout "${CIRCLE_SHA1}" || echo "SHA not found; using default branch"
      # Seconds, no compile: cmd.sh must read thinx.yml (repository content
      # carrying devsec credentials) without eval. Plain sh on the executor;
      # the image does not carry tests/.
      - run:
          name: thinx.yml loader test (cmd.sh never evals thinx.yml)
          command: sh tests/thinx-yml-loader.sh
      - docker/check
      - docker/build:
          image: suculent/nodemcu-docker-build
          tag: latest

  deploy-docker-build:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - run:
          name: Checkout (HTTPS, public repo)
          command: |
            git clone "https://github.com/suculent/nodemcu-docker-build.git" .
            git checkout "${CIRCLE_SHA1}" || echo "SHA not found; using default branch"
      - docker/check
      - docker/build:
          image: suculent/nodemcu-docker-build
          tag: latest
      - docker/push:
          digest-path: /tmp/digest.txt
          image: suculent/nodemcu-docker-build
          tag: latest
      - run:
          command: |
            echo "Digest is: $(</tmp/digest.txt)"
            docker tag $(</tmp/digest.txt) suculent/nodemcu-docker-build:latest

#
# WORKFLOWS
#

workflows:

  build:
    jobs:
      - test-docker-build:
          context:
            - dockerhub

      - deploy-docker-build:
          context:
            - dockerhub
          filters:
            branches:
              only: master